# 版本核对基准日：2026-10-04（Maven Central / Google Maven 元数据）
# 升级说明（审查报告 P2-1）：
# - 已升：AGP 9.4.1 / Kotlin 2.4.0 / KSP 2.3.12 / core-ktx 1.19.1 / appcompat 1.8.0 /
#   fragment 1.9.1 / lifecycle 2.11.0 / compose-bom 2026.09.00 / retrofit 2.12.0 /
#   gson 2.14.0 / gsy 13.2.1 / viewpager2 1.1.0 / swiperefresh 1.2.0 /
#   constraintlayout 2.2.2 / coordinatorlayout 1.3.0
# - 有意保留：okhttp 4.12.0（4.x 最终版，5.x 为破坏性大版本，需单独分支迁移并验证 GSY 兼容）、
#   glide 4.16.0（5.x 大版本）、material 1.14.0（当前最新）、flexbox 3.0.0（上游停更）
# - 已删除死条目：lifecycle-runtime-compose-android、transportation-consumer（Google Maps
#   Platform 商业条款，误引风险）、leakcanary、legacy-support-v4

